            <h3 class="cont-title">Percorrendo String</h3>
            <p>
                Para percorrer uma <strong>string</strong> utilizando o <strong>for</strong>, podemos fazer da seguinte forma:
            </p>

            <figure>
                <picture>
                    <img src="assets/imgs/exemplo_for_string.png" alt="For em String">
                </picture>

                <figcaption>
                    Dessa forma, podemos observar que o laço <strong>for</strong> percorre todos os caracteres da string.
                    
                    Para isso, utilizamos a <strong>variável i</strong>, que representa o <strong>índice</strong> (posição) de cada caractere.
                    
                    Com esse índice, conseguimos acessar cada letra da string utilizando <strong>string[i]</strong>, permitindo manipulá-la.
                    
                    O <strong>.length</strong> é utilizado para definir até onde o laço deve ir, ou seja, o tamanho total da string.
                    
                    Portanto, a condição <strong>i &lt; title.length</strong> significa que o laço continuará enquanto o índice for menor que o tamanho da string.
                </figcaption>

            </figure>
