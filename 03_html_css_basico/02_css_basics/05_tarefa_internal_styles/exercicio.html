<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Internal Styles</title>

    <style>
        em {
            font-style: normal;
        }
        strong {
            font-weight: normal;
        }
        a {
            color: black;
            text-decoration: none;
            cursor: default;
        }
    </style>
  </head>

  <body>
    <p>
      This is a paragraph with
      <em>italic</em>,
      <strong>strong</strong>
      and a

      <a href="https://www.my-link">
        link
      </a>
    </p>

    <br> <br>
    <a href="index.html" class="separado" style="display: block;">Voltar</a>
  </body>
</html>
