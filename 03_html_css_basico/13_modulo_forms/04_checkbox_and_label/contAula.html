<!-- #region HEAD -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula</title>
    <link rel="stylesheet" href="assets/styles/aulaStyle.css">
</head>
<!-- #endregion -->
<body>
    
    <main>

        <h1 class="title" id="page-title">Mate Academy</h1>

        <form action="#" method="post">
            <div class="form-field">Login:
                <input type="text" placeholder="Login" name="login">
            </div>
            
            <div class="form-field">Email:
                <input type="email" placeholder="Email" name="email">
            </div>

            <label class="form-field"> Senha:
                <input type="password" placeholder="Senha" name="password">
            </label>

            <div class="form-field" name="accepted">
                <input type="checkbox" id="validation" value="yes">
                <label for="validation">Aceitar Termos</label>
            </div>
            <button>Cadastrar</button>
        </form>

    </main>

    <!-- #region Voltar -->
    <a href="index.html" style="display: inline-block; padding: 20px; font-weight: bolder; color: red;">
        Voltar
    </a>
    <!-- #endregion -->

</body>
</html>
