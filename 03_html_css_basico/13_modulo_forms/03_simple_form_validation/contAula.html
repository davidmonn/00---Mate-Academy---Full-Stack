<!-- #region HEAD -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula</title>
    <link rel="stylesheet" href="assets/styles/aulaStyle.css">
</head>
<!-- #endregion -->
<body>
    
    <main>

        <h1 class="title" id="page-title">Mate Academy</h1>
        <form action="#" method="POST">
            <div class="form-field">
                Nome de Usuario:
                <input type="text" name="username" placeholder="Login" pattern="\w+" required>
            </div>
            <div class="form-field">
                Email:
                <input type="text" name="email" placeholder="Email">
            </div>
            <div class="form-field">
                Senha:
                <input type="password " name="password" placeholder="Senha" minlength="8" maxlength="16" required>
                <button>Enviar</button>
            </div>

        </form>

    </main>

    <!-- #region Voltar -->
    <a href="index.html" style="display: inline-block; padding: 20px; font-weight: bolder; color: red;">
        Voltar
    </a>
    <!-- #endregion -->

</body>
</html>
