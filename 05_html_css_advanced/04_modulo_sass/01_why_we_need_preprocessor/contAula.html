<!-- #region HEAD -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula</title>
    <link rel="stylesheet" href="assets/styles/aulaStyle.css" />
  </head>
  <!-- #endregion -->
  <body>
    <main>
      <h1 class="title" id="page-title">Mate Academy</h1>
      <div class="game">
        <div class="game__field">
          <div class="game__cell"></div>
          <div class="game__cell"></div>
          <div class="game__cell"></div>
          <div class="game__cell"></div>
          <div class="game__cell"></div>
          <div class="game__cell"></div>
          <div class="game__cell"></div>
          <div class="game__cell"></div>
          <div class="game__cell"></div>
        </div>

        <div class="
            game__player
            game__player--collor--red
            game__player--x--3
            game__player--y--1
            ">
        </div>

        <div class="
            game__player
            game__player--collor--green
            game__player--x--1
            game__player--y--2
            ">
        </div>

        <div class="
            game__player
            game__player--collor--blue
            game__player--x--2
            game__player--y--3
            ">
        </div>
      </div>
    </main>

    <!-- #region Voltar -->
    <a
      href="index.html"
      style="
        display: inline-block;

      "

      Voltar

</html>
