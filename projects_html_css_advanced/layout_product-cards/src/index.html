<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./index.scss"
    />
  </head>

  <body>
    <h1>Product cards</h1>
    <div
      data-qa="card"
      class="card"
    >
      <div class="card__image-container">
        <img
          class="card__image"
          src="./images/imac.jpeg"
          alt="APPLE A1419 iMac 27″ Retina 5K Monoblock"
        />
      </div>

      <div class="card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </div>

      <div class="card__sub-title">Product code: 195434</div>

      <div class="card__reviews">
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>

        <span class="card__reviews-count">Reviews: 5</span>
      </div>

      <div class="card__price-cont">
        <span class="card__text-price">Price:</span>
        <span class="card__text-value">$2,199</span>
      </div>

      <button class="card__cont-btn">
        <a
          data-qa="hover"
          class="card__buy-btn"
          href="#"
        >
          buy
        </a>
      </button>
    </div>
  </body>
</html>
